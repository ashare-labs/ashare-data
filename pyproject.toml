[build-system]
requires = ["hatchling==1.27.0", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "ashare-data"
version = "0.10.0.dev18"
description = "A数达: direct A-share market data with optional local caching"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "duckdb==1.4.3", "pandas==2.3.3",
    "numpy==2.4.6; python_version < '3.12'",
    "numpy==2.5.3; python_version >= '3.12'",
]

[project.optional-dependencies]
local-data = ["openpyxl==3.1.5", "quickjs==1.19.4", "baostock==0.9.4"]

[project.scripts]
ashare-data = "ashare_data.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0", "hatchling==1.27.0", "editables==0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
tmp_path_retention_count = 0
tmp_path_retention_policy = "none"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Source archives contain distributable project files only, including in Git worktrees.
[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/examples", "/scripts", "/docs", "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/pyproject.toml", "/uv.lock", "/.gitignore"]
exclude = ["/docs/feasibility.md", "/docs/rc1-to-rc2.md", "/examples/local_probe.py", "/review/rc1", "/src/ashare_data/pilot_evidence", "/tests/fixtures/calendar_pilot"]

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_data"]
exclude = ["/src/ashare_data/pilot_evidence"]
