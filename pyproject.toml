[build-system]
requires = ["hatchling==1.27.0", "editables==0.5"]
build-backend = "hatchling.build"

[project]
name = "ashare-data"
version = "0.8.4.dev1"
description = "A数达: direct A-share market data with optional local caching"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["duckdb==1.4.3", "pandas==2.3.3"]

[project.scripts]
ashare-data = "ashare_data.cli:main"

[dependency-groups]
dev = ["pytest==8.4.2", "ruff==0.14.0", "hatchling==1.27.0", "editables==0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# Preserve the independent six-case reproducer byte-for-byte; only its compact style is exempt.
[tool.ruff.lint.per-file-ignores]
"tests/test_regression_gates.py" = ["E401", "E701", "E702"]

[tool.ruff.format]
exclude = ["tests/test_regression_gates.py"]
